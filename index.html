<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="dark">
    <title>藏宝辅助工具</title>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: #121212;
            --border-color: #333333;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
            
            --accent: #00e5ff;         /* 亮青色 */
            --reveal-bg: #00e5ff;      /* 翻开颜色 - 亮青 */
            --exclude-bg: #c62828;     /* 深红色（排除） */
            
            --freq-1: #1a1a1a;
            --freq-2: #2a2a2a;
            --freq-3: #3d3d3d;
            --freq-4: #555555;
            --freq-5: #004d40;
            --freq-6: #00695c;
            --freq-7: #00897b;
            --freq-8: #4a148c;
        }

        html { color-scheme: dark; }
        * {
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box;
            forced-color-adjust: none !important;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 10px;
            margin: 0;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: var(--panel-bg);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        h1 {
            font-size: 16px; margin: 0; letter-spacing: 2px; font-weight: 900;
            background: #222; color: #ffffff !important;
            padding: 4px 10px; border-radius: 4px;
            border: 1px solid #333;
        }

        .section-title { font-size: 12px; font-weight: 600; margin: 15px 0 10px 0; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; }

        .shape-library {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px;
        }

        .shape-card {
            border: 1px solid var(--border-color);
            background: #1a1a1a;
            border-radius: 10px;
            padding: 15px 6px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: all 0.2s ease;
        }

        .shape-card.active {
            border-color: var(--accent);
            background: #102a30;
        }

        .shape-grid {
            display: grid;
            gap: 4px;
            justify-content: center;
            margin: 0 auto 6px auto;
            width: fit-content;
        }

        .shape-cell { width: 16px; height: 16px; background: transparent; border-radius: 3px; }
        .shape-cell.filled { background: var(--accent); }
        .shape-label { font-size: 13px; font-weight: 700; color: var(--text-sub); }
        .shape-card.active .shape-label { color: var(--accent); }

        .dir-badge {
            position: absolute; top: 4px; right: 4px;
            background: #333; color: #aaa !important;
            font-size: 11px; font-weight: 900;
            min-width: 22px; height: 22px; padding: 0 6px;
            border-radius: 11px; display: none;
            justify-content: center; align-items: center; z-index: 10;
            border: 1px solid #444;
        }

        .shape-card.active .dir-badge {
            display: flex; background: var(--accent);
            color: #000000 !important; border-color: #00acc1;
        }

        .mode-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
        .mode-btn {
            flex: 1; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 14px;
            cursor: pointer; text-align: center; transition: all 0.2s ease;
            border: 1px solid var(--border-color); background: #1a1a1a; color: var(--text-sub);
        }
        .mode-btn.active { background: #333; color: #ffffff !important; border-color: #555; }

        .main-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 15px;
            padding: 6px; background: #000; border-radius: 12px; border: 1px solid var(--border-color);
        }

        .grid-cell {
            aspect-ratio: 1; border-radius: 6px; display: flex; justify-content: center; align-items: center;
            font-size: 18px; cursor: pointer; user-select: none; transition: all 0.2s ease;
            background: #1a1a1a; border: 1px solid #222; position: relative;
            font-weight: 900; color: #ffffff !important;
        }

        /* 翻开：亮青底 + 黑字，和图案完全一致 */
        .grid-cell.reveal {
            background: var(--reveal-bg) !important; 
            border-color: #00acc1 !important;
            color: #000000 !important; 
            -webkit-text-fill-color: #000000 !important;
            font-size: 20px;
        }

        /* 排除：红底 + 白叉 */
        .grid-cell.exclude {
            background: var(--exclude-bg) !important; 
            border-color: #e53935 !important;
            color: #ffffff !important; 
            -webkit-text-fill-color: #ffffff !important;
            font-size: 20px;
        }

        .grid-cell.bg-freq-1 { background: var(--freq-1); color: #ffffff !important; }
        .grid-cell.bg-freq-2 { background: var(--freq-2); color: #ffffff !important; }
        .grid-cell.bg-freq-3 { background: var(--freq-3); color: #ffffff !important; }
        .grid-cell.bg-freq-4 { background: var(--freq-4); color: #ffffff !important; }
        .grid-cell.bg-freq-5 { background: var(--freq-5); color: #ffffff !important; }
        .grid-cell.bg-freq-6 { background: var(--freq-6); color: #ffffff !important; }
        .grid-cell.bg-freq-7 { background: var(--freq-7); color: #ffffff !important; }
        .grid-cell.bg-freq-8 { background: var(--freq-8); color: #ffffff !important; border-color: #6a1b9a; font-size: 20px; }

        .status-area { font-size: 13px; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
        .status-box {
            border: 1px solid var(--border-color); border-radius: 6px; padding: 6px 10px;
            font-weight: 600; color: var(--text-sub); background: #1a1a1a;
        }
        .status-box span { color: #ffffff !important; font-weight: 800; }
        .full-width { width: 100%; margin-bottom: 15px; text-align: center; }

        /* === 底部操作按钮 === */
        .action-buttons { display: flex; gap: 10px; }
        .action-btn {
            flex: 1; padding: 14px; border-radius: 8px; font-weight: 800; cursor: pointer;
            text-align: center; font-size: 15px; transition: all 0.2s ease; border: 1px solid transparent;
        }
        
        /* 【核心修改】清空按钮改为纯白背景 + 纯黑字，极为醒目 */
        .action-btn.primary { 
            background: #ffffff; 
            color: #000000 !important; 
            border-color: #ffffff; 
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.15);
        }
        .action-btn.primary:active { 
            background: #dddddd; 
            transform: scale(0.98); 
        }
        
        .action-btn.secondary { 
            background: transparent; 
            color: #ffffff !important; 
            border-color: var(--border-color); 
        }
        .action-btn.secondary:active { transform: scale(0.98); }

        .shape-card:active { transform: scale(0.95); }
        .grid-cell:active { transform: scale(0.9); }

        /* 抽屉与说明弹窗 */
        .sheet-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: flex-end; z-index: 1000; }
        .bottom-sheet { background: var(--panel-bg); width: 100%; max-width: 420px; border-radius: 20px 20px 0 0; padding: 20px; border-top: 1px solid var(--border-color); animation: slideUp 0.2s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .bottom-sheet h3 { margin: 0 0 15px 0; text-align: center; font-size: 16px; color: #ffffff !important; }
        .bottom-sheet h3 span { color: var(--accent); }
        .sheet-dir-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 12px; }
        .sheet-dir-btn { background: #222; color: #ffffff !important; border: 1px solid #444; border-radius: 10px; padding: 16px 0; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; transition: 0.2s; }
        .sheet-dir-btn.active { background: var(--accent); color: #000000 !important; border-color: var(--accent); font-weight: 900; }
        .sheet-dir-btn:active { transform: scale(0.95); }
        .sheet-cancel-btn { padding: 14px; width: 100%; background: transparent; color: #ff5252 !important; border: 1px solid #c62828; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 8px; }
        .sheet-close-btn { padding: 14px; width: 100%; background: transparent; color: #aaaaaa !important; border: 1px solid var(--border-color); border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; width: 100%; max-width: 320px; }
        .modal-content h2 { margin-top: 0; color: var(--accent); font-size: 18px; margin-bottom: 12px; }
        .modal-content ul { padding-left: 20px; font-size: 13px; color: #cccccc; line-height: 1.6; margin-bottom: 20px; }
        .modal-content li { margin-bottom: 8px; }
        .modal-content .close-btn { width: 100%; padding: 12px; background: var(--accent); color: #000000 !important; border: none; border-radius: 8px; font-weight: 900; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>藏宝</h1>
    </div>
    
    <div class="section-title">图形库</div>
    <div class="shape-library" id="shapeLibrary"></div>

    <div class="section-title">覆盖频次 · 点击标记</div>
    <div class="mode-buttons">
        <div class="mode-btn active" id="btnReveal" onclick="setMode('reveal')">翻开</div>
        <div class="mode-btn" id="btnExclude" onclick="setMode('exclude')">排除</div>
    </div>

    <div class="main-grid" id="mainGrid"></div>

    <div class="status-area">
        <div class="status-box">选中: <span id="statusShapes">无</span></div>
        <div class="status-box">翻开: <span id="statusReveal">0</span> 格</div>
    </div>
    
    <div class="status-box full-width">
        总合法摆法: <span id="totalSolutions">—</span>
    </div>

    <div class="action-buttons">
        <div class="action-btn primary" onclick="clearAll()">清空数据</div>
        <div class="action-btn secondary" onclick="toggleModal()">使用说明</div>
    </div>
</div>

<!-- 底部抽屉 -->
<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet(event)">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
        <h3>选择 <span id="sheetShapeName">IV</span> 的方向</h3>
        <div class="sheet-dir-grid" id="sheetDirGrid">
            <div class="sheet-dir-btn" data-dir="up">向上</div>
            <div class="sheet-dir-btn" data-dir="down">向下</div>
            <div class="sheet-dir-btn" data-dir="left">向左</div>
            <div class="sheet-dir-btn" data-dir="right">向右</div>
            <div class="sheet-dir-btn" data-dir="random">随机</div>
        </div>
        <button class="sheet-cancel-btn" id="btnDeselect">取消选择</button>
        <button class="sheet-close-btn" onclick="closeSheet()">取消</button>
    </div>
</div>

<!-- 使用说明弹窗 -->
<div class="modal-overlay" id="helpModal">
    <div class="modal-content">
        <h2>📖 使用说明</h2>
        <ul>
            <li><b>1. 选图形：</b>点击图形卡片选中，再次点击可修改方向或取消选择。</li>
            <li><b>2. 选方向：</b>点第二次卡片会弹出方向选择，包含向上、向下、向左、向右、随机。</li>
            <li><b>3. 标约束：</b>“翻开”指游戏里开出的正确格子，必须覆盖；“排除”指游戏里开出的错误格子，禁止触碰。</li>
            <li><b>4. 看结果：</b>格子数字代表被覆盖的频次，数字越大代表该格是正确格的概率越高。</li>
        </ul>
        <button class="close-btn" onclick="toggleModal()">我知道了</button>
    </div>
</div>

<script>
    const baseShapes = {
        'IV':   [[1,1,0,1],[1,0,1,0]], 
        'L':    [[1,0],[1,0],[1,0],[1,1]],
        '折线': [[1,0,0],[1,0,0],[1,1,1]],
        'P':    [[1,1],[1,1],[1,0]],
        'T':    [[1,1,1],[0,1,0],[0,1,0]],
        'U':    [[1,0,1],[1,1,1]]
    };

    const shapeRotations = {};
    for (const [key, matrix] of Object.entries(baseShapes)) {
        let rotations = [], current = matrix, seen = new Set();
        for (let i = 0; i < 4; i++) {
            const str = JSON.stringify(current);
            if (!seen.has(str)) { seen.add(str); rotations.push(current); }
            current = rotateMatrix(current);
        }
        shapeRotations[key] = rotations;
    }

    function rotateMatrix(matrix) {
        const rows = matrix.length, cols = matrix[0].length;
        const rotated = Array(cols).fill().map(() => Array(rows).fill(0));
        for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) rotated[x][rows - 1 - y] = matrix[y][x];
        return rotated;
    }

    let selectedShapes = new Map(); 
    let currentMode = 'reveal'; 
    let gridState = Array(5).fill().map(() => Array(5).fill(0));
    let coverageCounts = Array(5).fill().map(() => Array(5).fill(0));
    let currentEditingKey = null; 

    const dirSymbols = { 'up': '上', 'down': '下', 'left': '左', 'right': '右', 'random': '随' };
    const dirNames = { 'up': '向上', 'down': '向下', 'left': '向左', 'right': '向右', 'random': '随机' };

    const shapeLibraryEl = document.getElementById('shapeLibrary');
    for (const [key, matrix] of Object.entries(baseShapes)) {
        const card = document.createElement('div');
        card.className = 'shape-card';
        card.dataset.shape = key;

        const badge = document.createElement('div');
        badge.className = 'dir-badge';

        const gridDiv = document.createElement('div');
        gridDiv.className = 'shape-grid';
        renderShapePreview(gridDiv, matrix);

        const label = document.createElement('div');
        label.className = 'shape-label';
        label.textContent = key;

        card.appendChild(badge);
        card.appendChild(gridDiv);
        card.appendChild(label);
        
        card.onclick = () => handleCardClick(key, card, gridDiv);
        shapeLibraryEl.appendChild(card);
    }

    function renderShapePreview(container, matrix) {
        container.innerHTML = '';
        container.style.gridTemplateColumns = `repeat(${matrix[0].length}, 1fr)`;
        matrix.forEach(row => {
            row.forEach(cell => {
                const cellDiv = document.createElement('div');
                cellDiv.className = `shape-cell ${cell === 1 ? 'filled' : ''}`;
                container.appendChild(cellDiv);
            });
        });
    }

    function getRotationMatrix(key, dir) {
        const rotations = shapeRotations[key];
        let idx = 0;
        if (dir === 'right') idx = 1;
        else if (dir === 'down') idx = 2;
        else if (dir === 'left') idx = 3;
        return rotations[idx % rotations.length];
    }

    function handleCardClick(key, cardElement, gridDiv) {
        if (selectedShapes.has(key)) {
            openSheet(key); 
        } else {
            selectedShapes.set(key, 'random');
            cardElement.classList.add('active');
            cardElement.querySelector('.dir-badge').textContent = '随';
            renderShapePreview(gridDiv, baseShapes[key]); 
            updateStatus();
            calculateSolutions();
        }
    }

    function openSheet(key) {
        currentEditingKey = key;
        document.getElementById('sheetShapeName').textContent = key;
        
        const currentDir = selectedShapes.get(key) || 'random';
        document.querySelectorAll('.sheet-dir-btn').forEach(btn => {
            if (btn.dataset.dir === currentDir) btn.classList.add('active');
            else btn.classList.remove('active');
        });

        document.getElementById('sheetOverlay').style.display = 'flex';
    }

    function closeSheet(e) {
        if (e && e.target !== document.getElementById('sheetOverlay')) return;
        document.getElementById('sheetOverlay').style.display = 'none';
        currentEditingKey = null;
    }

    document.getElementById('sheetDirGrid').addEventListener('click', (e) => {
        const btn = e.target.closest('.sheet-dir-btn');
        if (!btn || !currentEditingKey) return;
        const dir = btn.dataset.dir;
        const key = currentEditingKey;
        
        selectedShapes.set(key, dir);
        
        const card = document.querySelector(`.shape-card[data-shape="${key}"]`);
        const badge = card.querySelector('.dir-badge');
        const gridDiv = card.querySelector('.shape-grid');
        
        badge.textContent = dirSymbols[dir];
        
        let previewMatrix = (dir === 'random') ? baseShapes[key] : getRotationMatrix(key, dir);
        renderShapePreview(gridDiv, previewMatrix);

        closeSheet();
        updateStatus();
        calculateSolutions();
    });

    document.getElementById('btnDeselect').addEventListener('click', () => {
        if (!currentEditingKey) return;
        const key = currentEditingKey;
        selectedShapes.delete(key);
        
        const card = document.querySelector(`.shape-card[data-shape="${key}"]`);
        card.classList.remove('active');
        const gridDiv = card.querySelector('.shape-grid');
        renderShapePreview(gridDiv, baseShapes[key]); 

        closeSheet();
        updateStatus();
        calculateSolutions();
    });

    const mainGridEl = document.getElementById('mainGrid');
    for (let y = 0; y < 5; y++) {
        for (let x = 0; x < 5; x++) {
            const cell = document.createElement('div');
            cell.className = 'grid-cell';
            cell.id = `cell-${x}-${y}`;
            cell.onclick = () => toggleCell(x, y);
            mainGridEl.appendChild(cell);
        }
    }

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('btnReveal').className = `mode-btn ${mode === 'reveal' ? 'active' : ''}`;
        document.getElementById('btnExclude').className = `mode-btn ${mode === 'exclude' ? 'active' : ''}`;
    }

    function toggleCell(x, y) {
        let state = gridState[y][x];
        if (currentMode === 'reveal') state = state === 1 ? 0 : 1; 
        else state = state === 2 ? 0 : 2; 
        gridState[y][x] = state;
        updateStatus();
        calculateSolutions();
    }

    function updateStatus() {
        let shapeStrings = [];
        for (const [key, dir] of selectedShapes.entries()) {
            shapeStrings.push(`${key}(${dirNames[dir]})`);
        }
        document.getElementById('statusShapes').textContent = shapeStrings.length > 0 ? shapeStrings.join(', ') : '无';
        
        let revealCount = 0;
        gridState.forEach(row => row.forEach(cell => { if (cell === 1) revealCount++; }));
        document.getElementById('statusReveal').textContent = revealCount;
    }

    function calculateSolutions() {
        coverageCounts = Array(5).fill().map(() => Array(5).fill(0));
        let totalSolutions = 0;

        let globalRevealCount = 0;
        gridState.forEach(row => row.forEach(cell => { if (cell === 1) globalRevealCount++; }));

        if (selectedShapes.size > 0) {
            for (const [key, dir] of selectedShapes.entries()) {
                const matrices = (dir === 'random') ? shapeRotations[key] : [getRotationMatrix(key, dir)];
                
                for (const matrix of matrices) {
                    const h = matrix.length, w = matrix[0].length;
                    for (let y = 0; y <= 5 - h; y++) {
                        for (let x = 0; x <= 5 - w; x++) {
                            if (isPlacementValidSingle(matrix, x, y, globalRevealCount)) {
                                totalSolutions++;
                                for (let dy = 0; dy < h; dy++) {
                                    for (let dx = 0; dx < w; dx++) {
                                        if (matrix[dy][dx] === 1) coverageCounts[y + dy][x + dx]++;
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
        
        document.getElementById('totalSolutions').textContent = totalSolutions > 0 ? totalSolutions + ' 种' : '0 种';
        renderGrid();
    }

    function isPlacementValidSingle(matrix, ox, oy, globalRevealCount) {
        let currentRevealCount = 0;
        for (let y = 0; y < matrix.length; y++) {
            for (let x = 0; x < matrix[y].length; x++) {
                if (matrix[y][x] === 1) {
                    const gridX = ox + x, gridY = oy + y;
                    if (gridX >= 5 || gridY >= 5) return false;
                    if (gridState[gridY][gridX] === 2) return false;
                    if (gridState[gridY][gridX] === 1) currentRevealCount++;
                }
            }
        }
        if (globalRevealCount > 0 && currentRevealCount !== globalRevealCount) return false;
        return true;
    }

    function renderGrid() {
        for (let y = 0; y < 5; y++) {
            for (let x = 0; x < 5; x++) {
                const cell = document.getElementById(`cell-${x}-${y}`);
                const count = coverageCounts[y][x], state = gridState[y][x];
                cell.className = 'grid-cell';
                cell.textContent = ''; 

                if (state === 1) {
                    cell.classList.add('reveal');
                    cell.textContent = count > 0 ? count : '-';
                } else if (state === 2) {
                    cell.classList.add('exclude');
                    cell.textContent = '✕';
                } else {
                    if (count > 0) {
                        const freqClass = Math.min(count, 8);
                        cell.classList.add(`bg-freq-${freqClass}`);
                        cell.textContent = count;
                    } else {
                        cell.textContent = '0';
                    }
                }
            }
        }
    }

    function toggleModal() {
        const modal = document.getElementById('helpModal');
        modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    function clearAll() {
        gridState = Array(5).fill().map(() => Array(5).fill(0));
        coverageCounts = Array(5).fill().map(() => Array(5).fill(0));
        selectedShapes.clear();
        closeSheet();
        
        document.querySelectorAll('.shape-card').forEach(card => {
            card.classList.remove('active');
            const key = card.dataset.shape;
            const gridDiv = card.querySelector('.shape-grid');
            renderShapePreview(gridDiv, baseShapes[key]);
        });
        
        updateStatus();
        calculateSolutions();
    }
</script>
</body>
</html>
